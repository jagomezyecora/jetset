<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JetSet - Prototype</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#102030" />
    <link rel="icon" href="/assets/favicon.ico">
    <link rel="shortcut icon" href="/assets/favicon.ico">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script>
      // global error capture to expose stack and messages to page console
      window.addEventListener('error', function (e) {
        try {
          console && console.error && console.error('Global error:', e.message || e.error || e)
          try { if (e.error && e.error.stack) console.error(e.error.stack) } catch(_) {}
        } catch (err) {}
      })
      window.addEventListener('unhandledrejection', function (e) {
        try {
          console && console.error && console.error('Unhandled rejection:', e.reason || e)
          try { if (e.reason && e.reason.stack) console.error(e.reason.stack) } catch(_) {}
        } catch (err) {}
      })
    </script>
  </head>
  <body>
    <div id="bloom"></div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

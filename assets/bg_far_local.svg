<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="900" viewBox="0 0 2400 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g1" x1="0%" x2="100%" y1="20%" y2="80%">
      <stop offset="0%" stop-color="#36454F" />
      <stop offset="50%" stop-color="#5A6B73" />
      <stop offset="100%" stop-color="#9FB1B8" />
    </linearGradient>
    <filter id="noise" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="2" stitchTiles="stitch" result="t" />
      <feColorMatrix type="saturate" values="0.0" />
      <feBlend in="SourceGraphic" in2="t" mode="overlay" />
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.25" />
      </feComponentTransfer>
    </filter>
    <radialGradient id="sun" cx="20%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#fff8e6" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#ffd88a" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffb37a" stop-opacity="0.02" />
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#g1)" />
  <ellipse cx="1200" cy="50" rx="900" ry="220" fill="url(#sun)" />
  <g filter="url(#noise)" opacity="0.12">
    <rect width="100%" height="100%" fill="#ffffff" />
  </g>
  <!-- soft photographic bokeh blobs -->
  <g opacity="0.22" fill-opacity="0.9">
    <circle cx="300" cy="220" r="160" fill="#102030" filter="url(#blur)" />
  </g>
</svg>

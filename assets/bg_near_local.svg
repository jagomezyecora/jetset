<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="900" viewBox="0 0 2400 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g3" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#172028" />
      <stop offset="100%" stop-color="#2e3f45" />
    </linearGradient>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence baseFrequency="0.9" numOctaves="1" stitchTiles="stitch" result="n" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.08" />
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="n" mode="overlay" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#g3)" />
  <!-- foreground texture, slightly sharper -->
  <g opacity="0.28" filter="url(#grain)">
    <rect x="0" y="540" width="2400" height="400" fill="#1f2a2f" />
    <g fill="#26343a" opacity="0.4">
      <ellipse cx="400" cy="740" rx="240" ry="60" />
      <ellipse cx="1000" cy="760" rx="320" ry="80" />
      <ellipse cx="1800" cy="700" rx="300" ry="90" />
    </g>
  </g>
</svg>
